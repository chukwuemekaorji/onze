<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensei, Your FPL Coach</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-brand">
          <span class="topbar-logo" aria-hidden="true">⚽</span>
          <span class="topbar-title">Sensei</span>
        </div>
        <div id="gw-info" class="gw-info" hidden></div>
        <button id="refresh-button" class="ghost-button" type="button" hidden>
          Refresh
        </button>
        <button id="change-id-button" class="ghost-button" type="button" hidden>
          Change manager ID
        </button>
      </header>

      <form id="coach-form" class="setup-card">
        <label for="manager-id">FPL Manager ID</label>
        <div class="setup-row">
          <input
            id="manager-id"
            name="manager-id"
            type="number"
            min="1"
            placeholder="e.g. 1234567"
            required
          />
          <button id="submit-button" type="submit">Get my report</button>
        </div>
        <p id="status" role="status"></p>
      </form>

      <main id="results" class="layout" hidden>
        <section class="panel report-panel">
          <div class="panel-header">
            <h2>Your Squad</h2>
          </div>
          <ul id="squad-list" class="squad-grid"></ul>

          <div id="report" class="report"></div>

          <div class="lineup-image-card">
            <img id="lineup-image" alt="Recommended starting lineup" />
          </div>
        </section>

        <aside id="chat-panel" class="panel chat-panel" hidden>
          <div class="panel-header">
            <h2>Ask Sensei</h2>
          </div>
          <div id="chat-disabled" class="chat-disabled" hidden>
            Chat needs an Anthropic API key configured on this deployment.
            The report above used the rule-based fallback writer instead.
          </div>
          <div id="chat-messages" class="chat-messages"></div>
          <form id="chat-form" class="chat-form">
            <input
              id="chat-input"
              type="text"
              placeholder="Ask a follow-up, e.g. why not captain Salah?"
              autocomplete="off"
            />
            <button type="submit" aria-label="Send">Send</button>
          </form>
        </aside>
      </main>
    </div>

    <script type="module" src="dist/app.js"></script>
  </body>
</html>
