# typecheck, lint, formatting, tests and the production build on every push to
# main and every pull request. no secrets: the app never holds an anthropic
# key, and the tests never call fpl or anthropic
name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch or pull request makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check
