<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11" stitchTiles="stitch" />
    <!-- ink coloured specks, alpha taken from the noise's red channel -->
    <feColorMatrix type="matrix" values="0 0 0 0 0.106  0 0 0 0 0.102  0 0 0 0 0.09  1.6 0 0 0 -0.62" />
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)" />
</svg>
